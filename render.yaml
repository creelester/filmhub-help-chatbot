services:
   - type: web
     name: filmhub-help-chatbot-api
     runtime: node
     plan: free
     buildCommand: bun install
     startCommand: bun --cwd packages/server run start
     healthCheckPath: /
     envVars:
        - key: OPENAI_API_KEY
          sync: false
        - key: BUN_VERSION
          value: 1.3.11
   - type: web
     name: filmhub-help-chatbot-client
     runtime: static
     buildCommand: bun install && bun --cwd packages/client run build
     staticPublishPath: packages/client/dist
     envVars:
        - key: BUN_VERSION
          value: 1.3.11
     routes:
        - type: rewrite
          source: /api/*
          destination: https://filmhub-help-chatbot-api.onrender.com/api/*
        - type: rewrite
          source: /*
          destination: /index.html
